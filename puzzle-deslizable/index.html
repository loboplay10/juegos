<style>

.app{min-height:100dvh}.screen{width:min(100%,1080px);margin:auto;padding:max(18px,env(safe-area-inset-top)) clamp(14px,4vw,34px) max(26px,env(safe-area-inset-bottom))}
.hidden{display:none!important}.row{display:flex;align-items:center}.space{justify-content:space-between}.gap{gap:10px}.muted{color:var(--muted)}
.btn{min-height:48px;border:1px solid var(--border);border-radius:14px;padding:11px 16px;color:var(--text);background:rgba(255,255,255,.065);font-weight:850;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.12);transition:transform 120ms ease,background 120ms ease,border-color 120ms ease,opacity 120ms ease}
.btn:hover{background:rgba(255,255,255,.105)}.btn:active{transform:translateY(1px) scale(.985)}.btn.primary{background:linear-gradient(135deg,#8177ff,#6559ed);box-shadow:0 13px 30px rgba(94,82,225,.32)}.btn.primary:hover{background:linear-gradient(135deg,#8c83ff,#6d61f4)}.btn.ghost{background:transparent;box-shadow:none}.btn.danger{background:rgba(239,110,121,.13);border-color:rgba(239,110,121,.26);color:#ffc2c8}.btn.block{width:100%}
.icon{width:44px;height:44px;border:1px solid var(--border);border-radius:14px;color:var(--text);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;font-size:1.08rem}.icon:active{transform:scale(.96)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.player{display:flex;align-items:center;gap:10px}.avatar{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#ffbd6a,#ef7b74);color:#261323;font-weight:950;box-shadow:0 10px 24px rgba(0,0,0,.18)}.player strong{display:block}.player small{color:var(--muted)}.coin{height:44px;padding:0 13px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:7px;font-weight:900}.coin b{color:var(--gold)}

.eyebrow{margin:0 0 6px;color:var(--accent);font-size:.72rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.05em}.hero p{color:var(--soft);line-height:1.5;max-width:520px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}.tag{padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.05);font-size:.75rem;font-weight:800}.hero-puzzle{justify-self:end;width:min(36vw,330px);aspect-ratio:1;border-radius:26px;padding:10px;background:#0e1730;box-shadow:0 28px 50px rgba(0,0,0,.34);transform:rotate(2deg);position:relative}.hero-puzzle .mini{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.hero-puzzle span{display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,#eef3ff,#bbc8e4);color:#17203d;font-weight:950;font-size:clamp(1rem,4vw,2rem)}.hero-puzzle i{border-radius:9px;background:rgba(255,255,255,.04)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card-btn{min-height:110px;border:1px solid var(--border);border-radius:22px;padding:18px;background:rgba(255,255,255,.045);color:var(--text);text-align:left;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px}.card-btn:hover{background:rgba(255,255,255,.075)}.card-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:rgba(117,107,255,.15);font-size:1.35rem}.card-btn strong{display:block;font-size:1rem}.card-btn small{color:var(--muted)}.locked{opacity:.55;cursor:not-allowed}.footer-stats{display:flex;justify-content:center;gap:20px;color:var(--muted);font-size:.78rem;margin:18px 0 0}
.header{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:20px}.header h1{margin:0;text-align:center;font-size:clamp(1.35rem,3vw,1.8rem)}.header small{display:block;text-align:center;color:var(--muted);margin-top:3px}

.levels{display:grid;gap:12px}.level{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:22px;background:rgba(255,255,255,.045);cursor:pointer;text-align:left;color:var(--text)}.level:hover{background:rgba(255,255,255,.075)}.thumb{width:92px;aspect-ratio:1;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#2b3b6e,#182442);display:grid;place-items:center;font-size:1.5rem;font-weight:950}.thumb img{width:100%;height:100%;object-fit:cover}.level h2{font-size:1rem;margin:0 0 4px}.level p{margin:0 0 7px;color:var(--muted);font-size:.75rem}.stars{letter-spacing:.1em;color:var(--gold);font-size:.9rem}.diff{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.055);color:var(--soft);font-size:.68rem;font-weight:850;text-transform:uppercase}
.game-screen{max-width:980px}.game-hud{display:grid;grid-template-columns:48px 1fr 48px;align-items:center}.game-hud h1{text-align:center;margin:0;font-size:1.1rem}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,600px);margin:12px auto}.stat{padding:10px 8px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.045);text-align:center}.stat span{display:block;color:var(--muted);font-size:.61rem;text-transform:uppercase;letter-spacing:.08em}.stat strong{font-size:.92rem}
.stage{display:grid;justify-items:center}.board-frame{width:min(92vw,61dvh,560px);aspect-ratio:1;padding:8px;border-radius:26px;background:linear-gradient(145deg,#26365f,#101a35);box-shadow:0 26px 65px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.08);position:relative}.board{position:relative;width:100%;height:100%;overflow:hidden;border-radius:19px;background:#0c1429;touch-action:none;--n:3;--gap:3px}.tile{position:absolute;left:0;top:0;width:calc(100% / var(--n));height:calc(100% / var(--n));padding:var(--gap);border:0;background:transparent;transition:transform 165ms var(--ease);z-index:2;cursor:pointer}.face{width:100%;height:100%;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#f0f4ff,#b7c5e4);color:#19223f;font-weight:950;font-size:clamp(1.25rem,7vw,2.9rem);box-shadow:0 4px 11px rgba(0,0,0,.15);transition:transform 120ms ease,box-shadow 120ms ease}.tile.movable:hover .face{transform:scale(.975);box-shadow:0 4px 14px rgba(85,216,197,.17),inset 0 0 0 2px rgba(85,216,197,.45)}.tile:active .face{transform:scale(.95)}.tile.image .face{background-image:var(--img);background-size:var(--bg-size);background-position:var(--bg-x) var(--bg-y);background-repeat:no-repeat;color:transparent}.empty{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));padding:var(--gap);left:0;top:0;transition:transform 165ms var(--ease)}.empty:after{content:"";display:block;width:100%;height:100%;border-radius:12px;background:rgba(255,255,255,.028);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}.tile.hint .face{animation:hint 600ms ease-in-out 2;box-shadow:0 0 0 4px rgba(255,211,106,.32),0 0 26px rgba(255,211,106,.26)}@keyframes hint{50%{transform:scale(.92)}}
.board.invalid{animation:nudge 180ms ease}@keyframes nudge{35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}.tutorial{min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--soft);font-size:.8rem;margin-top:9px}.tutorial b{color:var(--accent)}.hand{position:absolute;z-index:8;font-size:2rem;filter:drop-shadow(0 5px 7px rgba(0,0,0,.35));animation:hand 900ms ease-in-out infinite;pointer-events:none}@keyframes hand{50%{transform:translate(-5px,-5px) rotate(-18deg)}0%,100%{transform:translate(7px,7px) rotate(-18deg)}}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:min(100%,650px);margin:10px auto}.controls .btn{flex:1;min-width:115px;max-width:210px}.goal{text-align:center;color:var(--muted);font-size:.68rem}.preview-overlay{position:absolute;z-index:10;inset:8px;border-radius:19px;overflow:hidden;background:#0c1429}.preview-overlay img{width:100%;height:100%;object-fit:cover}.preview-overlay:after{content:"Imagen resuelta";position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:rgba(7,12,29,.75);font-size:.7rem;font-weight:850;white-space:nowrap}.solved-overlay{position:absolute;z-index:9;inset:8px;border-radius:19px;overflow:hidden;opacity:0;animation:fade .35s ease .12s forwards}.solved-overlay img{width:100%;height:100%;object-fit:cover}@keyframes fade{to{opacity:1}}
.modal-wrap{position:fixed;z-index:50;inset:0;padding:20px;display:grid;place-items:center;background:rgba(3,7,18,.72);backdrop-filter:blur(12px)}.modal{width:min(100%,430px);border:1px solid rgba(255,255,255,.11);border-radius:28px;background:linear-gradient(160deg,#202c50,#151e3b);box-shadow:0 30px 90px rgba(0,0,0,.5);padding:25px}.modal h2{margin:0 0 9px}.modal p{color:var(--soft);line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.victory{text-align:center;animation:pop .35s var(--ease)}@keyframes pop{from{transform:scale(.88) translateY(18px);opacity:0}}.badge{width:58px;height:58px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(145deg,#61e0a4,#41b98c);color:#0e3326;font-size:1.8rem;font-weight:950}.big-stars{font-size:1.9rem;color:var(--gold);letter-spacing:.11em;margin:10px 0}.result{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.result div{padding:11px;border-radius:14px;background:rgba(255,255,255,.055)}.result span{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase}.reward{width:max-content;margin:0 auto 18px;padding:9px 13px;border-radius:999px;background:rgba(255,211,106,.1);color:#ffe6a6;border:1px solid rgba(255,211,106,.17);font-weight:900}.victory .btn{width:100%;margin-top:8px}
.settings{display:grid;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.045)}.setting small{display:block;color:var(--muted);margin-top:3px}.switch{width:54px;height:31px;border:0;border-radius:999px;background:#263250;padding:3px;cursor:pointer}.switch i{display:block;width:25px;height:25px;border-radius:50%;background:#eef3ff;transition:transform .18s ease}.switch.on{background:var(--primary)}.switch.on i{transform:translateX(23px)}.range{width:150px}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.collection-card{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.045)}.collection-card img{width:100%;aspect-ratio:1;object-fit:cover}.collection-card div{padding:12px}.collection-card strong{display:block}.collection-card small{color:var(--muted)}.empty-collection{grid-column:1/-1;padding:35px;text-align:center;border:1px dashed var(--border);border-radius:22px;color:var(--muted)}
.toast{position:fixed;z-index:80;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);padding:10px 14px;border-radius:999px;background:#edf1ff;color:#17203d;font-weight:850;box-shadow:0 15px 38px rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:.2s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center;min-height:0}.hero-puzzle{order:-1;justify-self:center;width:min(68vw,250px)}.hero p{margin-left:auto;margin-right:auto}.tags{justify-content:center}.menu-grid{grid-template-columns:1fr}.card-btn{min-height:88px}.collection{grid-template-columns:1fr 1fr}}

.theme-preview{height:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;padding:16px}.theme-preview i,.theme-preview b{display:grid;place-items:center;border-radius:8px;background:#dfe7f5;color:#1c2741;font-style:normal;font-weight:950}.theme-preview.theme-wood{background:linear-gradient(90deg,#6d3f24,#a46a3b 24%,#79472b 50%,#b77a45 76%,#6f4027)}.theme-preview.theme-gold{background:linear-gradient(135deg,#7c5512,#f5d87d,#9b6915)}.theme-preview.theme-marble{background:linear-gradient(135deg,#f0f1f4,#adb5c3 35%,#fbfbfc 50%,#9aa4b4 62%,#e9ebef)}.theme-preview.theme-neon{background:#070914;box-shadow:inset 0 0 24px #7064ff}.theme-preview.theme-neon i,.theme-preview.theme-neon b{background:#161a35;color:#eafcff;box-shadow:0 0 12px #55d8c5}.background-preview{height:100%;display:grid;place-items:center;font-size:3rem}.background-preview.bg-midnight{background:linear-gradient(160deg,#111a34,#0b1124)}.background-preview.bg-aurora{background:radial-gradient(circle at 20% 20%,#55d8c5 0,transparent 35%),radial-gradient(circle at 75% 30%,#756bff 0,transparent 38%),#14152f}.background-preview.bg-ocean{background:linear-gradient(#1aa5cc,#075177 62%,#072f4d)}.background-preview.bg-sunset{background:linear-gradient(#5a4b9f,#ef7b74 55%,#f3bd72)}.background-preview.bg-stars{background:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 75%,#fff 0 2px,transparent 3px),#080c20}

lume=+e.target.value;persist();e.target.closest('.setting').querySelector('small').textContent=Math.round(save.settings.volume*100)+'%'};document.querySelector('[data-reset-progress]').onclick=()=>showConfirm('¿Borrar progreso?','Esta acción solo afecta esta vista previa.',()=>{save=defaults();persist();renderSettings();toast('Progreso restablecido')})}

ta-equip]').forEach(b=>b.onclick=()=>equipItem(b.dataset.equip,b.dataset.id));document.querySelector('[data-demo-coins]').onclick=()=>{save.coins+=500;persist();renderShop();toast('+500 monedas para probar la tienda')}}
function shopCosmeticCard(type,x,owned,equipped){const preview=type==='board'?`<div class="theme-preview theme-${x.id}"><i>1</i><i>2</i><i>3</i><b></b></div>`:`<div class="background-preview bg-${x.id}"><span>${x.icon}</span></div>`;return `<article class="shop-item"><div class="shop-preview">${preview}</div><div class="shop-copy"><h2>${x.name}</h2><p>${x.desc}</p><div class="shop-price">${x.cost?`◆ ${x.cost}`:'Incluido'}</div></div>${equipped?`<button class="btn" disabled>Equipado ✓</button>`:owned?`<button class="btn primary" data-equip="${type}" data-id="${x.id}">Equipar</button>`:`<button class="btn" data-buy="${type}" data-id="${x.id}" data-cost="${x.cost}">Comprar</button>`}</article>`}
function buyItem(type,id,cost){if(save.coins<cost){toast('No tienes suficientes monedas');beep('bad');return}save.coins-=cost;if(type==='board')save.inventory.boards.push(id);if(type==='background')save.inventory.backgrounds.push(id);if(type==='map')save.inventory.maps.push(+id);persist();beep('buy');vibrate(18);renderShop();toast('Compra realizada')}
function equipItem(type,id){if(type==='board')save.inventory.equippedBoard=id;else save.inventory.equippedBackground=id;persist();renderShop();toast('Diseño equipado')}
function renderCustom(){const c=save.custom;app.innerHTML=`<main class="screen">${topHeader('Mi mapa','Crea un puzle con una foto de tu galería')}<section class="custom-layout"><div class="custom-preview">${c?.img?`<img src="${c.img}" alt="Vista previa de tu mapa">`:`<div><b>＋</b><span>Elige una foto</span><small>Se recortará visualmente a formato cuadrado durante el puzle.</small></div>`}</div><div class="custom-form"><label><span>Foto</span><input id="customFile" type="file" accept="image/*"><small>JPG, PNG, WebP o una foto de tu galería.</small></label><label><span>Nombre del mapa</span><input id="customName" type="text" maxlength="32" value="${escapeAttr(c?.name||'Mi foto')}" placeholder="Ej. Mi mascota"></label><label><span>Tamaño / cantidad de fichas</span><select id="customSize">${[3,4,5,6,7].map(n=>`<option value="${n}" ${(c?.n||3)==n?'selected':''}>${n}×${n} · ${n*n-1} fichas</option>`).join('')}</select></label><label><span>Dificultad de mezcla</span><select id="customDiff">${['Fácil','Normal','Difícil','Experto'].map(d=>`<option ${c?.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></label><div class="custom-actions"><button class="btn" id="saveCustom" ${c?.img?'':'disabled'}>Guardar cambios</button><button class="btn primary" id="playCustom" ${c?.img?'':'disabled'}>▶ Jugar mi mapa</button></div><p class="custom-note">Tu imagen se guarda solo en este navegador. La demo la comprime para no ocupar demasiado espacio.</p></div></section></main>`;bindCommon();const file=document.getElementById('customFile');file.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Selecciona un archivo de imagen');return}try{const img=await compressImage(f,900,.84);save.custom={...(save.custom||{}),img,name:document.getElementById('customName').value||'Mi foto',n:+document.getElementById('customSize').value,difficulty:document.getElementById('customDiff').value};persist();renderCustom();toast('Foto preparada')}catch{toast('No se pudo procesar la imagen')}};document.getElementById('saveCustom').onclick=()=>{if(!save.custom?.img)return;save.custom={...save.custom,name:document.getElementById('customName').value||'Mi foto',n:+document.getElementById('customSize').value,difficulty:document.getElementById('customDiff').value};persist();renderCustom();toast('Mapa actualizado')};document.getElementById('playCustom').onclick=()=>{document.getElementById('saveCustom').click();go('game','custom')}}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function compressImage(file,maxSide=900,quality=.84){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
function bindCommon(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>go('game',b.dataset.play))}
function solved(n){return Array.from({length:n*n},(_,i)=>i===n*n-1?0:i+1)}
function neighbors(blank,n){const r=Math.floor(blank/n),c=blank%n,a=[];if(r>0)a.push(blank-n);if(r<n-1)a.push(blank+n);if(c>0)a.push(blank-1);if(c<n-1)a.push(blank+1);return a}
function shuffled(n,moves){const b=solved(n);let blank=b.length-1,prev=-1;for(let i=0;i<moves;i++){let opts=neighbors(blank,n).filter(x=>x!==prev);if(!opts.length)opts=neighbors(blank,n);const pos=opts[Math.floor(Math.random()*opts.length)];b[blank]=b[pos];b[pos]=0;prev=blank;blank=pos}if(isSolved(b))return shuffled(n,moves+1);return b}
function isSolved(b){return b.every((v,i)=>v===(i===b.length-1?0:i+1))}
function alignedWithBlank(board,n,tile){const pos=board.indexOf(tile),blank=board.indexOf(0);return pos>=0&&(Math.floor(pos/n)===Math.floor(blank/n)||pos%n===blank%n)}
function canMove(board,n,tile){return save.settings.movementMode==='multi'?alignedWithBlank(board,n,tile):neighbors(board.indexOf(0),n).includes(board.indexOf(tile))}
function moveToBlank(board,n,tile){const pos=board.indexOf(tile),blank=board.indexOf(0);if(pos<0)return null;if(save.settings.movementMode!=='multi'){if(!neighbors(blank,n).includes(pos))return null;const next=[...board];next[blank]=tile;next[pos]=0;return next}const sameRow=Math.floor(pos/n)===Math.floor(blank/n),sameCol=pos%n===blank%n;if(!sameRow&&!sameCol)return null;const next=[...board],step=sameRow?(pos<blank?-1:1):(pos<blank?-n:n);let i=blank;while(i!==pos){next[i]=next[i+step];i+=step}next[pos]=0;return next}
function startGame(id){const level=getLevel(id);if(!level){go('custom');return}session={level,board:shuffled(level.n,level.shuffle),initial:null,moves:0,elapsed:0,complete:false};session.initial=[...session.board];tutorialDone=!level.tutorial;hintTile=null;startedAt=performance.now();startTimer();renderGame()}
function timeNow(){if(!session)return 0;return session.elapsed+(startedAt?(performance.now()-startedAt)/1000:0)}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(timerId)clearInterval(timerId);if(!startedAt)startedAt=performance.now();timerId=setInterval(()=>{const el=document.getElementById('time');if(el&&session&&!session.complete)el.textContent=fmt(timeNow())},250)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}if(session&&!session.complete&&startedAt){session.elapsed=timeNow();startedAt=0}}
document.addEventListener('visibilitychange',()=>{if(!session||session.complete)return;if(document.hidden)stopTimer();else startTimer()})
function renderGame(){const l=session.level,b=session.board,n=l.n,blank=b.indexOf(0),mode=save.settings.movementMode;app.innerHTML=`<main class="screen game-screen"><div class="game-hud"><button class="icon" id="backBtn">←</button><h1>${l.custom?'Mi mapa':l.special?'Mapa especial':'Nivel '+l.id} · ${l.title}</h1><button class="icon" id="gameOpts">⋯</button></div><div class="status"><div class="stat"><span>Tiempo</span><strong id="time">${fmt(timeNow())}</strong></div><div class="stat"><span>Movimientos</span><strong id="moves">${session.moves}</strong></div><div class="stat"><span>Modo</span><strong>${mode==='multi'?'Múltiple':'Individual'}</strong></div></div><section class="stage"><div class="board-frame theme-${save.inventory.equippedBoard}"><div class="board" id="board" style="--n:${n}">${Array.from({length:n*n-1},(_,i)=>i+1).map(tile=>tileHtml(tile,b.indexOf(tile),canMove(b,n,tile),l)).join('')}<div class="empty" style="transform:${posTransform(blank,n)}"></div>${!tutorialDone?tutorialHand(neighbors(blank,n)[0],n):''}</div>${previewing&&l.img?`<div class="preview-overlay"><img src="${l.img}" alt="Imagen resuelta"></div>`:''}</div>${!tutorialDone?`<div class="tutorial" id="gameCaption"><b>☝</b> Desliza o toca una pieza junto al espacio vacío.</div>`:`<div class="tutorial muted" id="gameCaption">${mode==='multi'?'Toca cualquier ficha de la misma fila o columna del hueco para mover la cadena completa.':l.kind==='image'?'Reconstruye la imagen completa.':'Ordena los números de menor a mayor.'}</div>`}</section><div class="controls"><button class="btn" id="resetBtn">↻ Reiniciar</button><button class="btn" id="hintBtn">✦ Pista</button>${l.img?`<button class="btn" id="previewBtn">◉ Ver imagen</button>`:''}</div><div class="goal">2 estrellas ≤ ${l.two} movimientos · 3 estrellas ≤ ${l.target}</div></main>`;bindGame();if(hintTile)flashHint(hintTile)}
function tileHtml(tile,pos,movable,l){const n=l.n,target=tile-1,row=Math.floor(target/n),col=target%n,bgx=n===1?0:col/(n-1)*100,bgy=n===1?0:row/(n-1)*100;const style=`transform:${posTransform(pos,n)};${l.img?`--img:url(&quot;${l.img}&quot;);--bg-size:${n*100}% ${n*100}%;--bg-x:${bgx}%;--bg-y:${bgy}%;`:''}`;return `<button class="tile ${l.img?'image':''} ${movable?'movable':''}" data-tile="${tile}" style="${style}" aria-label="Pieza ${tile}"><span class="face">${l.img?'':tile}</span></button>`}
function posTransform(pos,n){return `translate(${(pos%n)*100}%,${Math.floor(pos/n)*100}%)`}
function tutorialHand(pos,n){const x=(pos%n)*100/n+100/n*.55,y=Math.floor(pos/n)*100/n+100/n*.55;return `<div class="hand" style="left:${x}%;top:${y}%">☝</div>`}
function bindGame(){document.getElementById('backBtn').onclick=()=>{if(session.moves)showConfirm('¿Salir del nivel?','Tu progreso de esta partida no se guardará.',()=>go(session.level.custom?'custom':session.level.special?'shop':'home'));else go(session.level.custom?'custom':session.level.special?'shop':'home')};document.getElementById('gameOpts').onclick=()=>showGameOptions();document.getElementById('resetBtn').onclick=()=>{if(session.moves)showConfirm('¿Reiniciar puzle?','Volverás a la mezcla inicial.',resetGame);else resetGame()};document.getElementById('hintBtn').onclick=()=>{const blank=session.board.indexOf(0),opts=neighbors(blank,session.level.n);hintTile=session.board[opts[Math.floor(Math.random()*opts.length)]];beep();flashHint(hintTile)};const pv=document.getElementById('previewBtn');if(pv){const on=e=>{e.preventDefault();previewing=true;showPreviewOverlay()};const off=e=>{e?.preventDefault();previewing=false;document.querySelector('.preview-overlay')?.remove()};pv.addEventListener('pointerdown',on);pv.addEventListener('pointerup',off);pv.addEventListener('pointercancel',off);pv.addEventListener('pointerleave',e=>{if(e.buttons)off(e)})}document.querySelectorAll('.tile').forEach(t=>{t.onpointerdown=e=>{pointerStart={x:e.clientX,y:e.clientY,tile:+t.dataset.tile};t.setPointerCapture?.(e.pointerId)};t.onpointerup=e=>{if(!pointerStart)return;const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y,tile=pointerStart.tile;pointerStart=null;if(Math.hypot(dx,dy)<12){tryMove(tile);return}const pos=session.board.indexOf(tile),blank=session.board.indexOf(0),n=session.level.n,tr=Math.floor(pos/n),tc=pos%n,br=Math.floor(blank/n),bc=blank%n,horiz=Math.abs(dx)>=Math.abs(dy),ok=horiz?(tc!==bc&&Math.sign(dx)===Math.sign(bc-tc)):(tr!==br&&Math.sign(dy)===Math.sign(br-tr));if(ok)tryMove(tile);else invalidMove()};t.onpointercancel=()=>pointerStart=null});window.onkeydown=keyMove}
function showPreviewOverlay(){if(document.querySelector('.preview-overlay'))return;const o=document.createElement('div');o.className='preview-overlay';o.innerHTML=`<img src="${session.level.img}" alt="Imagen resuelta">`;document.querySelector('.board-frame')?.appendChild(o)}
function showGameOptions(){const multi=save.settings.movementMode==='multi',w=document.createElement('div');stopTimer();w.className='modal-wrap';w.innerHTML=`<div class="modal"><h2>Opciones de partida</h2><p>Cambia el modo sin salir del nivel.</p><div class="segmented wide"><button data-m="single" class="${!multi?'active':''}">Individual</button><button data-m="multi" class="${multi?'active':''}">Múltiple</button></div><div class="modal-actions"><button class="btn" data-menu>Menú</button><button class="btn primary" data-close>Continuar</button></div></div>`;document.body.appendChild(w);w.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{save.settings.movementMode=b.dataset.m;persist();w.remove();renderGame();startTimer();toast('Modo cambiado')});w.querySelector('[data-menu]').onclick=()=>{w.remove();go('home')};w.querySelector('[data-close]').onclick=()=>{w.remove();startTimer()}}
function resetGame(){session.board=[...session.initial];session.moves=0;session.elapsed=0;startedAt=performance.now();tutorialDone=!session.level.tutorial;previewing=false;renderGame();startTimer()}
function invalidMove(){beep('bad');const board=document.getElementById('board');board?.classList.remove('invalid');if(board){void board.offsetWidth;board.classList.add('invalid')}}
function tryMove(tile){if(!session||session.complete)return;const next=moveToBlank(session.board,session.level.n,tile);if(!next){invalidMove();return}session.board=next;session.moves++;save.stats.totalMoves++;tutorialDone=true;beep();vibrate();updateBoardView();if(isSolved(next)){session.complete=true;session.elapsed=timeNow();stopTimer();setTimeout(showSolved,280)}}
function updateBoardView(){const b=session.board,n=session.level.n,blank=b.indexOf(0);document.querySelectorAll('.tile').forEach(t=>{const tile=+t.dataset.tile,pos=b.indexOf(tile);t.style.transform=posTransform(pos,n);t.classList.toggle('movable',canMove(b,n,tile))});const empty=document.querySelector('.empty');if(empty)empty.style.transform=posTransform(blank,n);const moves=document.getElementById('moves');if(moves)moves.textContent=session.moves;document.querySelector('.hand')?.remove();const cap=document.getElementById('gameCaption');if(cap){cap.className='tutorial muted';cap.innerHTML=save.settings.movementMode==='multi'?'Toca una ficha alineada con el hueco para desplazar toda la cadena.':session.level.kind==='image'?'Reconstruye la imagen completa.':'Ordena los números de menor a mayor.'}}
function flashHint(tile){const t=document.querySelector(`[data-tile="${tile}"]`);if(!t)return;t.classList.add('hint');setTimeout(()=>{hintTile=null;t.classList.remove('hint')},1300)}
function keyMove(e){if(!session||screen!=='game'||document.querySelector('.modal-wrap'))return;const map={ArrowLeft:[0,1],a:[0,1],A:[0,1],ArrowRight:[0,-1],d:[0,-1],D:[0,-1],ArrowUp:[1,0],w:[1,0],W:[1,0],ArrowDown:[-1,0],s:[-1,0],S:[-1,0]};const v=map[e.key];if(!v)return;e.preventDefault();const n=session.level.n,blank=session.board.indexOf(0),r=Math.floor(blank/n),c=blank%n,nr=r+v[0],nc=c+v[1];if(nr>=0&&nr<n&&nc>=0&&nc<n){const tile=session.board[nr*n+nc];if(tile){const mode=save.settings.movementMode;save.settings.movementMode='single';tryMove(tile);save.settings.movementMode=mode}}}
function calcStars(){return session.moves<=session.level.target?3:session.moves<=session.level.two?2:1}
function showSolved(){const l=session.level,stars=calcStars();beep('win');vibrate(35);const overlay=document.createElement('div');overlay.className='solved-overlay';overlay.innerHTML=l.img?`<img src="${l.img}" alt="">`:'';document.querySelector('.board-frame')?.appendChild(overlay);let reward=0;if(!l.custom){const prev=save.results[l.id],bestMoves=Math.min(prev?.bestMoves??Infinity,session.moves),bestTime=Math.min(prev?.bestTime??Infinity,Math.round(session.elapsed)),first=!prev?.completed,bonus=first?l.reward:Math.floor(l.reward*.35),starBonus=stars===3?20:stars===2?10:0;reward=bonus+starBonus;save.results[l.id]={completed:true,stars:Math.max(prev?.stars||0,stars),bestMoves,bestTime};if(!l.special)save.unlocked=Math.max(save.unlocked,Math.min(8,+l.id+1));save.coins+=reward;save.stats.solved+=1;save.stats.playSeconds+=Math.round(session.elapsed);if(l.kind==='image'&&!save.collected.includes(l.id))save.collected.push(l.id);persist()}setTimeout(()=>showVictory(stars,reward),320)}
function showVictory(stars,reward){const l=session.level,r=save.results[l.id],wrap=document.createElement('div');wrap.className='modal-wrap';wrap.innerHTML=`<div class="modal victory"><div class="badge">✓</div><p class="eyebrow">${l.custom?'Mapa personalizado':l.special?'Mapa especial completado':'Nivel '+l.id+' completado'}</p><h2>¡PUZLE COMPLETADO!</h2><div class="big-stars">${starsText(stars)}</div><div class="result"><div><span>Tiempo</span><strong>${fmt(session.elapsed)}</strong></div><div><span>Movimientos</span><strong>${session.moves}</strong></div>${r?`<div><span>Mejor tiempo</span><strong>${fmt(r.bestTime)}</strong></div><div><span>Mejor marca</span><strong>${r.bestMoves} mov.</strong></div>`:''}</div>${reward?`<div class="reward">◆ +${reward} monedas</div>`:''}${!l.special&&!l.custom&&+l.id<8?`<button class="btn primary" data-next>SIGUIENTE NIVEL</button>`:''}<button class="btn" data-replay>REPETIR</button><button class="btn ghost" data-menu>MENÚ</button></div>`;document.body.appendChild(wrap);wrap.querySelector('[data-next]')?.addEventListener('click',()=>{wrap.remove();go('game',+l.id+1)});wrap.querySelector('[data-replay]').onclick=()=>{wrap.remove();go('game',l.id)};wrap.querySelector('[data-menu]').onclick=()=>{wrap.remove();go('home')}}
function showConfirm(title,text,onOk,okText='Aceptar',cancelText='Cancelar'){const w=document.createElement('div');w.className='modal-wrap';stopTimer();w.innerHTML=`<div class="modal"><h2>${title}</h2><p>${text}</p><div class="modal-actions"><button class="btn ghost" data-cancel>${cancelText}</button><button class="btn primary" data-ok>${okText}</button></div></div>`;document.body.appendChild(w);w.querySelector('[data-cancel]').onclick=()=>{w.remove();if(session)startTimer()};w.querySelector('[data-ok]').onclick=()=>{w.remove();onOk?.()}}
renderHome();
})();
</script>
